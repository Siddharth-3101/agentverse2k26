<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentVerse | Faculty Portal - Teacher Dashboard</title>
  <meta name="description" content="AgentVerse Faculty Portal for managing student clubs, applications, and activities." />
  
  <!-- Modern Typography (Plus Jakarta Sans & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN for instant rendering -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for instant browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-scaleUp {
      animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // --- Mock Data: Teacher & Applications (strictly John Teacher -> Coding Club) ---

    const CLUB_SUMMARY = {

    const INITIAL_NOTIFICATIONS = [

      },
      {

        yearOfStudy: '4th Year',
        clubName: 'Coding Club',
        reason: 'Eager to explore embedded systems programming and algorithmic problem solving while mentoring junior club members.',
        skills: 'C++, Embedded C, Data Structures, Algorithms, Leadership',
        status: 'PENDING',
        read: false,
        createdAt: '1 hour ago',
        type: 'application'
      },
      {
        id: 'notif-104',
        applicationId: 'app-104',
        studentName: 'Priya Sharma',
        studentId: '24CSE112',
        email: 'priya.sharma@student.com',
        phoneNumber: '9123456780',
        department: 'Computer Science and Engineering',
        yearOfStudy: '1st Year',
        clubName: 'Coding Club',
        reason: 'Passionate about competitive programming and building AI algorithms. I look forward to participating in coding sprints and learning from seniors.',
        skills: 'Python, C, Problem Solving, Mathematics',
        status: 'PENDING',
        read: true,
        createdAt: 'Yesterday',
        type: 'application'
      },
      {
        id: 'notif-105',
        applicationId: 'app-105',
        studentName: 'Sneha Patel',
        studentId: '23CSE078',
        email: 'sneha.patel@student.com',
        phoneNumber: '9876501234',
        department: 'Computer Science and Engineering',
        yearOfStudy: '2nd Year',
        clubName: 'Coding Club',
        reason: 'Interested in full stack web development and contributing to club project repositories.',
        skills: 'JavaScript, HTML/CSS, Git, Problem Solving',
        status: 'PENDING',
        read: true,
        createdAt: 'Yesterday',
        type: 'application'
      },
      {
        id: 'notif-106',
        applicationId: 'app-106',
        studentName: 'Vikram Patel',
        studentId: '22ME034',
        email: 'vikram.patel@student.com',
        phoneNumber: '9988776655',
        department: 'Mechanical Engineering',
        yearOfStudy: '3rd Year',
        clubName: 'Coding Club',
        reason: 'Interested in robotics simulation and computational mechanics. Looking to contribute multidisciplinary engineering perspectives.',
        skills: 'Python, MATLAB, ROS, CAD',
        status: 'ACCEPTED',
        read: true,
        createdAt: '2 days ago',
        type: 'application'
      },
      {
        id: 'notif-107',
        applicationId: 'app-107',
        studentName: 'Ananya Iyer',
        studentId: '23ECE056',
        email: 'ananya.iyer@student.com',
        phoneNumber: '9123498765',
        department: 'Electronics and Communication Engineering',
        yearOfStudy: '2nd Year',
        clubName: 'Coding Club',
        reason: 'Looking to join the competitive coding division.',
        skills: 'Java, DSA, OOP',
        status: 'DECLINED',
        read: true,
        createdAt: '3 days ago',
        type: 'application'
      }
    ];

    // --- React Context ---
    const TeacherContext = createContext(null);

    const TeacherProvider = ({ children }) => {
      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'notifications' | 'profile'
      const [selectedApplication, setSelectedApplication] = useState(null);
      const [notificationFilter, setNotificationFilter] = useState('all');

      const unreadCount = notifications.filter(n => !n.read).length;
      const pendingCount = notifications.filter(n => n.status === 'PENDING').length;

      const markAsRead = (id) => {
        setNotifications(prev =>
          prev.map(n => (n.id === id || n.applicationId === id ? { ...n, read: true } : n))
        );
      };

      const markAllAsRead = () => {
        setNotifications(prev => prev.map(n => ({ ...n, read: true })));
      };

      const updateApplicationStatus = (applicationId, status) => {
        setNotifications(prev =>
          prev.map(n =>
            n.applicationId === applicationId ? { ...n, status, read: true } : n
          )
        );
        setSelectedApplication(prev =>
          prev && prev.applicationId === applicationId ? { ...prev, status, read: true } : prev
        );
      };

      const openApplicationReview = (item) => {
        markAsRead(item.id);
        setSelectedApplication(item);
        setActiveTab('notifications');
      };

      return (
        <TeacherContext.Provider
          value={{
            teacher: TEACHER_PROFILE,
            club: CLUB_SUMMARY,
            notifications,
            unreadCount,
            pendingCount,
            activeTab,
            setActiveTab,
            selectedApplication,
            setSelectedApplication,
            notificationFilter,
            setNotificationFilter,
            markAsRead,
            markAllAsRead,
            updateApplicationStatus,
            openApplicationReview
          }}
        >
          {children}
        </TeacherContext.Provider>
      );
    };

    const useTeacher = () => useContext(TeacherContext);

    // --- Component: ConfirmDialog (for Decline action) ---
    const ConfirmDialog = ({ isOpen, title, message, confirmText, cancelText, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-md bg-white rounded-2xl p-6 shadow-2xl border border-slate-200 animate-scaleUp">
            <div className="flex items-center gap-3 mb-3">
              <div className="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600 font-bold">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              </div>
              <h3 className="text-lg font-bold text-slate-800">{title}</h3>
            </div>
            <p className="text-sm text-slate-600 mb-6 leading-relaxed">{message}</p>
            <div className="flex items-center justify-end gap-3 pt-2 border-t border-slate-100">
              <button
                type="button"
                id="cancelDeclineBtn"
                onClick={onCancel}
                className="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
              >
                {cancelText || 'Cancel'}
              </button>
              <button
                type="button"
                id="confirmDeclineBtn"
                onClick={onConfirm}
                className="px-4 py-2 text-sm font-medium text-white bg-rose-600 hover:bg-rose-700 rounded-xl transition-all shadow-sm"
              >
                {confirmText || 'Decline Application'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Component: ApplicationCard (Strictly 8 Fields Display) ---
    const ApplicationCard = ({ application, onBack, onStatusChange }) => {
      const [showDeclineModal, setShowDeclineModal] = useState(false);
      const [feedback, setFeedback] = useState(null);

      if (!application) return null;

      const {
        applicationId,
        studentName,
        studentId,
        email,
        phoneNumber,
        department,
        yearOfStudy,
        clubName = 'Coding Club',
        reason,
        skills,
        status = 'PENDING'
      } = application;

      const isProcessed = status === 'ACCEPTED' || status === 'DECLINED';

      const handleAccept = () => {
        onStatusChange(applicationId, 'ACCEPTED');
        setFeedback({
          type: 'success',
          text: '✓ Application accepted successfully'
        });
      };

      const handleConfirmDecline = () => {
        setShowDeclineModal(false);
        onStatusChange(applicationId, 'DECLINED');
        setFeedback({
          type: 'declined',
          text: '✕ Application declined'
        });
      };

      const skillList = typeof skills === 'string'
        ? skills.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean)
        : Array.isArray(skills) ? skills : [];

      return (
        <div className="space-y-6 max-w-4xl mx-auto animate-fadeIn">
          {/* Top Bar with Back button & Status */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
            <button
              type="button"
              id="backToNotificationsBtn"
              onClick={onBack}
              className="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-colors w-fit px-3 py-1.5 rounded-lg hover:bg-indigo-50"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
              <span>Back to Notifications</span>
            </button>

            <div className="flex items-center gap-3">
              <span className="text-xs uppercase tracking-wider font-semibold text-slate-400">
                Pending Review
              </span>
              <span
                id="applicationStatusBadge"
                className={`inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${
                  status === 'ACCEPTED'
                    ? 'bg-emerald-100 text-emerald-800'
                    : status === 'DECLINED'
                    ? 'bg-rose-100 text-rose-800'
                    : 'bg-amber-100 text-amber-800'
                }`}
              >
                [{status}]
              </span>
            </div>
          </div>

          {/* Feedback banner */}
          {feedback && (
            <div
              id="decisionFeedbackBanner"
              className={`p-4 rounded-xl text-sm font-medium flex items-center justify-between border ${
                feedback.type === 'success'
                  ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                  : 'bg-rose-50 text-rose-800 border-rose-200'
              }`}
            >
              <span>{feedback.text}</span>
              <button onClick={() => setFeedback(null)} className="text-xs font-bold underline">
                Dismiss
              </button>
            </div>
          )}

          <div>
            <h2 className="text-2xl font-bold text-slate-800">Application Review</h2>
            <p className="text-sm text-slate-500 mt-1">
              Review submitted membership application for {clubName}.
            </p>
          </div>

          {/* Card 1: Student Information (Strictly 6 fields) */}
          <div className="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-xs space-y-4">
            <h3 className="text-base font-bold text-slate-800 pb-2 border-b border-slate-100">
              Student Information
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-1">
              {/* 1. Full Name */}
              <div>
                <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                  Full Name
                </span>
                <span id="field-fullName" className="text-sm font-semibold text-slate-800">
                  {studentName}
                </span>
              </div>

              {/* 2. Student ID */}
              <div>
                <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                  Student ID
                </span>
                <span id="field-studentId" className="text-sm font-semibold text-slate-800">
                  {studentId}
                </span>
              </div>

              {/* 3. Email ID */}
              <div>
                <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                  Email ID
                </span>
                <span id="field-email" className="text-sm font-semibold text-slate-800 break-all">
                  {email}
                </span>
              </div>

              {/* 4. Phone Number */}
              <div>
                <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                  Phone Number
                </span>
                <span id="field-phoneNumber" className="text-sm font-semibold text-slate-800">
                  {phoneNumber}
                </span>
              </div>

              {/* 5. Department */}
              <div>
                <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                  Department
                </span>
                <span id="field-department" className="text-sm font-semibold text-slate-800">
                  {department}
                </span>
              </div>

              {/* 6. Year of Study */}
              <div>
                <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                  Year of Study
                </span>
                <span id="field-yearOfStudy" className="text-sm font-semibold text-slate-800">
                  {yearOfStudy}
                </span>
              </div>
            </div>
          </div>

          {/* Card 2: Why do you want to join this club? (Field 7) */}
          <div className="bg-white rounded-2xl p-6 sm:p-7 border border-slate-200/80 shadow-xs space-y-2">
            <h3 className="text-sm font-bold text-slate-800">
              Why do you want to join this club?
            </h3>
            <p id="field-reason" className="text-sm text-slate-600 leading-relaxed italic bg-slate-50/80 p-4 rounded-xl border border-slate-100">
              "{reason}"
            </p>
          </div>

          {/* Card 3: What skills do you have to join this club? (Field 8) */}
          <div className="bg-white rounded-2xl p-6 sm:p-7 border border-slate-200/80 shadow-xs space-y-3">
            <h3 className="text-sm font-bold text-slate-800">
              What skills do you have to join this club?
            </h3>
            <div id="field-skills" className="pt-1">
              <div className="text-sm font-medium text-slate-700 bg-slate-50/80 p-3.5 rounded-xl border border-slate-100">
                {skillList.join(' • ')}
              </div>
              <div className="flex flex-wrap items-center gap-2 pt-2.5">
                {skillList.map((skill, idx) => (
                  <span
                    key={idx}
                    className="inline-flex items-center gap-1.5 px-3 py-1 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-semibold border border-indigo-100/80"
                  >
                    <span className="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
                    {skill}
                  </span>
                ))}
              </div>
            </div>
          </div>

          {/* Card 5: Application Status & Decision Buttons */}
          <div className="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                Application Status
              </span>
              <span
                className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${
                  status === 'ACCEPTED'
                    ? 'bg-emerald-100 text-emerald-800'
                    : status === 'DECLINED'
                    ? 'bg-rose-100 text-rose-800'
                    : 'bg-amber-100 text-amber-800'
                }`}
              >
                [{status}]
              </span>
            </div>

            <div className="flex items-center gap-3 w-full sm:w-auto">
              <button
                type="button"
                id="declineApplicationBtn"
                onClick={() => setShowDeclineModal(true)}
                disabled={isProcessed}
                className={`flex-1 sm:flex-initial px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-xs ${
                  isProcessed
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                    : 'bg-white text-rose-600 border border-rose-300 hover:bg-rose-50 active:bg-rose-100'
                }`}
              >
                Decline
              </button>

              <button
                type="button"
                id="acceptApplicationBtn"
                onClick={handleAccept}
                disabled={isProcessed}
                className={`flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-xs ${
                  isProcessed
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                    : 'bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white'
                }`}
              >
                Accept
              </button>
            </div>
          </div>

          <ConfirmDialog
            isOpen={showDeclineModal}
            title="Decline Application?"
            message={`Are you sure you want to decline this student's application?`}
            confirmText="Decline Application"
            cancelText="Cancel"
            onConfirm={handleConfirmDecline}
            onCancel={() => setShowDeclineModal(false)}
          />
        </div>
      );
    };

    // --- Component: NotificationCard ---
    const NotificationCard = ({ notification, onClick }) => {
      const { studentName, clubName, createdAt, read, status } = notification;
      return (
        <div
          onClick={() => onClick(notification)}
          className={`group relative rounded-2xl p-5 transition-all duration-200 cursor-pointer border ${
            !read
              ? 'bg-indigo-50/40 border-l-4 border-l-indigo-600 border-indigo-200/80 shadow-xs hover:bg-indigo-50/70 hover:shadow-sm'
              : 'bg-white border-slate-200/80 hover:border-slate-300 hover:shadow-xs'
          }`}
        >
          <div className="flex items-start justify-between gap-4">
            <div className="flex items-start gap-3.5 flex-1 min-w-0">
              <div
                className={`w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 font-bold text-sm transition-colors ${
                  !read
                    ? 'bg-indigo-600 text-white shadow-xs shadow-indigo-200'
                    : 'bg-slate-100 text-slate-600 group-hover:bg-indigo-100 group-hover:text-indigo-600'
                }`}
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>

              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap mb-0.5">
                  <span className={`text-sm font-bold truncate ${!read ? 'text-slate-900' : 'text-slate-700'}`}>
                    {studentName}
                  </span>
                  <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-600">
                    {clubName}
                  </span>
                  {status && (
                    <span
                      className={`text-[11px] px-2 py-0.5 rounded-full font-semibold ${
                        status === 'ACCEPTED'
                          ? 'bg-emerald-100 text-emerald-700'
                          : status === 'DECLINED'
                          ? 'bg-rose-100 text-rose-700'
                          : 'bg-amber-100 text-amber-700'
                      }`}
                    >
                      {status}
                    </span>
                  )}
                </div>

                <p className={`text-sm leading-snug mb-1 ${!read ? 'font-semibold text-indigo-950' : 'text-slate-600'}`}>
                  Applied to {clubName}
                </p>

                <p className="text-xs text-slate-500 line-clamp-1">
                  {studentName} has submitted an application to join your club.
                </p>

                <div className="flex items-center gap-3 mt-2.5 text-xs text-slate-400">
                  <span className="inline-flex items-center gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    {createdAt}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex flex-col items-end justify-between self-stretch">
              {!read ? (
                <span className="w-2.5 h-2.5 rounded-full bg-indigo-600 ring-4 ring-indigo-100" title="Unread notification"></span>
              ) : (
                <span className="w-2.5 h-2.5"></span>

                  </div>
                  {unreadCount > 0 && (
                    <span id="sidebarNotificationBadge" className="px-2 py-0.5 text-xs font-bold rounded-full bg-indigo-600 text-white shadow-xs">
                      {unreadCount}
                    </span>
                  )}
                </button>

                {/* 3. ♙ Profile */}
                <button
                  type="button"
                  id="navSidebarProfile"
                  onClick={() => handleNavClick('profile')}
                  className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                    activeTab === 'profile'
                      ? 'bg-indigo-50 text-indigo-600 border border-indigo-100/80 font-bold shadow-xs'
                      : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                  }`}
                >
                  <svg className={`w-5 h-5 ${activeTab === 'profile' ? 'text-indigo-600' : 'text-slate-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  <span>Profile</span>
                </button>
              </nav>

              {/* Mentored Club Footnote in Sidebar */}
              <div className="p-4 border-t border-slate-100">
                <div className="bg-slate-50 rounded-2xl p-3.5 border border-slate-100">
                  <span className="text-[10px] uppercase font-extrabold text-slate-400 tracking-wider block mb-1">
                    Mentored Club
                  </span>
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span className="text-xs font-bold text-slate-800 truncate">
                      {teacher.club}
                    </span>
                  </div>
                </div>
              </div>
            </aside>

            {/* MAIN AREA */}
            <div className="flex-1 flex flex-col min-w-0">
              {/* CLEAN TOP HEADER (No notification bell, no profile button in header) */}
              <header className="h-18 bg-white border-b border-slate-200/80 px-6 sm:px-8 flex items-center justify-between sticky top-0 z-30 shadow-xs">
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setIsMobileMenuOpen(true)}
                    className="lg:hidden p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl"
                  >
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                  </button>

                  <div className="flex items-center gap-2 text-sm">
                    <span className="font-semibold text-slate-400 hidden sm:inline">AgentVerse</span>
                    <span className="text-slate-300 hidden sm:inline">/</span>
                    <h2 className="text-lg sm:text-xl font-bold text-slate-800 tracking-tight">
                      {getHeaderTitle()}
                    </h2>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold px-3 py-1 bg-slate-100 text-slate-600 rounded-full border border-slate-200/60 hidden sm:inline-block">
                    Mentor: {teacher.club}
                  </span>
                </div>
              </header>

              {/* Main Workspace Body */}
              <main className="flex-1 p-6 sm:p-8 lg:p-10">
                {activeTab === 'dashboard' && <TeacherDashboard />}
                {activeTab === 'notifications' && <TeacherNotifications />}
                {activeTab === 'profile' && <TeacherProfile />}
              </main>
            </div>
          </div>
        </div>
      );
    };

    // Mount App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <TeacherProvider>
        <TeacherLayout />
      </TeacherProvider>
    );
  </script>
</body>
</html>
