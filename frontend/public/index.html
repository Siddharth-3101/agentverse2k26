<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentVerse | Faculty Portal - Teacher Dashboard</title>
  <meta name="description" content="AgentVerse Faculty Portal for managing student clubs, applications, and activities." />
  
  <!-- Modern Typography (Plus Jakarta Sans & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN for instant rendering -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for instant browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-scaleUp {
      animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">

    const INITIAL_NOTIFICATIONS = [

      {

        skills: 'C++, Embedded C, Data Structures, Algorithms, Leadership',
        status: 'PENDING',
        read: false,
        createdAt: '1 hour ago',
        type: 'application'
      },
      {
        id: 'notif-104',
        applicationId: 'app-104',
        studentName: 'Priya Sharma',
        studentId: '24CSE112',
        email: 'priya.sharma@student.com',
        phoneNumber: '9123456780',
        department: 'Computer Science and Engineering',
        yearOfStudy: '1st Year',
        clubName: 'Coding Club',
        reason: 'Passionate about competitive programming and building AI algorithms. I look forward to participating in coding sprints and learning from seniors.',
        skills: 'Python, C, Problem Solving, Mathematics',
        status: 'PENDING',
        read: true,
        createdAt: 'Yesterday',
        type: 'application'
      },
      {
        id: 'notif-105',
        applicationId: 'app-105',
        studentName: 'Sneha Patel',
        studentId: '23CSE078',
        email: 'sneha.patel@student.com',
        phoneNumber: '9876501234',
        department: 'Computer Science and Engineering',
        yearOfStudy: '2nd Year',
        clubName: 'Coding Club',
        reason: 'Interested in full stack web development and contributing to club project repositories.',
        skills: 'JavaScript, HTML/CSS, Git, Problem Solving',
        status: 'PENDING',
        read: true,
        createdAt: 'Yesterday',
        type: 'application'
      },
      {
        id: 'notif-106',
        applicationId: 'app-106',
        studentName: 'Vikram Patel',
        studentId: '22ME034',
        email: 'vikram.patel@student.com',
        phoneNumber: '9988776655',
        department: 'Mechanical Engineering',
        yearOfStudy: '3rd Year',
        clubName: 'Coding Club',
        reason: 'Interested in robotics simulation and computational mechanics. Looking to contribute multidisciplinary engineering perspectives.',
        skills: 'Python, MATLAB, ROS, CAD',
        status: 'ACCEPTED',
        read: true,
        createdAt: '2 days ago',
        type: 'application'
      },
      {
        id: 'notif-107',
        applicationId: 'app-107',
        studentName: 'Ananya Iyer',
        studentId: '23ECE056',
        email: 'ananya.iyer@student.com',
        phoneNumber: '9123498765',
        department: 'Electronics and Communication Engineering',
        yearOfStudy: '2nd Year',
        clubName: 'Coding Club',
        reason: 'Looking to join the competitive coding division.',
        skills: 'Java, DSA, OOP',
        status: 'DECLINED',
        read: true,
        createdAt: '3 days ago',
        type: 'application'
      }
    ];

    // --- React Context ---
    const TeacherContext = createContext(null);

    const TeacherProvider = ({ children }) => {
      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedApplication, setSelectedApplication] = useState(null);
      const [notificationFilter, setNotificationFilter] = useState('all');
      const [teacherProfile, setTeacherProfile] = useState(TEACHER_PROFILE);

      const unreadCount = notifications.filter(n => !n.read).length;
      const pendingCount = notifications.filter(n => n.status === 'PENDING').length;

      const updateTeacherProfile = (updatedData) => {
        setTeacherProfile(prev => ({ ...prev, ...updatedData }));
      };

      const markAsRead = (id) => {
        setNotifications(prev =>
          prev.map(n => (n.id === id || n.applicationId === id ? { ...n, read: true } : n))
        );
      };

      const markAllAsRead = () => {
        setNotifications(prev => prev.map(n => ({ ...n, read: true })));
      };

      const updateApplicationStatus = (applicationId, status) => {
        setNotifications(prev =>
          prev.map(n =>
            n.applicationId === applicationId ? { ...n, status, read: true } : n
          )
        );
        setSelectedApplication(prev =>
          prev && prev.applicationId === applicationId ? { ...prev, status, read: true } : prev
        );
      };

      const openApplicationReview = (item) => {
        markAsRead(item.id);
        setSelectedApplication(item);
        setActiveTab('notifications');
      };

      return (
        <TeacherContext.Provider
          value={{
            teacher: teacherProfile,
            updateTeacherProfile,
            club: CLUB_SUMMARY,
            notifications,
            unreadCount,
            pendingCount,
            activeTab,
            setActiveTab,
            selectedApplication,
            setSelectedApplication,
            notificationFilter,
            setNotificationFilter,
            markAsRead,
            markAllAsRead,
            updateApplicationStatus,
            openApplicationReview
          }}
        >
          {children}
        </TeacherContext.Provider>
      );
    };

    const useTeacher = () => useContext(TeacherContext);

    // --- Component: ApplicationCard ---
    const ApplicationCard = ({ application, onBack, onStatusChange }) => {
      const [showDeclineModal, setShowDeclineModal] = useState(false);
      const [feedbackMessage, setFeedbackMessage] = useState(null);

      if (!application) return null;

      const {
        id,
        applicationId,
        studentName,
        studentId,
        email,
        phoneNumber,
        department,
        yearOfStudy,
        clubName = 'Coding Club',
        reason,
        skills,
        status = 'PENDING'
      } = application;

      const targetAppId = applicationId || id;
      const isProcessed = status === 'ACCEPTED' || status === 'DECLINED';

      const handleAccept = () => {
        if (isProcessed) return;
        onStatusChange(targetAppId, 'ACCEPTED');
        setFeedbackMessage({
          type: 'success',
          text: 'Application accepted successfully.'
        });
      };

      const handleConfirmDecline = () => {
        setShowDeclineModal(false);
        if (isProcessed) return;
        onStatusChange(targetAppId, 'DECLINED');
        setFeedbackMessage({
          type: 'declined',
          text: 'Application declined.'
        });
      };

      const skillList = typeof skills === 'string'
        ? skills.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean)
        : Array.isArray(skills) ? skills : [];

      return (
        <div className="space-y-8 max-w-5xl mx-auto animate-fadeIn pb-12">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200/80">
            <button
              type="button"
              id="backToNotificationsBtn"
              onClick={onBack}
              className="inline-flex items-center gap-2 text-xs sm:text-sm font-bold text-indigo-600 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl transition-all duration-150 border border-indigo-100 w-fit"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
              <span>Back to Notifications</span>
            </button>

            <div className="flex items-center gap-3">
              <span className="text-xs font-semibold text-slate-400">
                Application Status:
              </span>
              <span
                id="applicationStatusBadge"
                className={`inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider ${
                  status === 'ACCEPTED'
                    ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                    : status === 'DECLINED'
                    ? 'bg-rose-100 text-rose-800 border border-rose-300'
                    : 'bg-amber-100 text-amber-800 border border-amber-300'
                }`}
              >
                <span
                  className={`w-2 h-2 rounded-full ${
                    status === 'ACCEPTED'
                      ? 'bg-emerald-500'
                      : status === 'DECLINED'
                      ? 'bg-rose-500'
                      : 'bg-amber-500 animate-pulse'
                  }`}
                ></span>
                {status}
              </span>
            </div>
          </div>

          <div>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
              Application Review
            </h1>
            <p className="text-sm text-slate-500 mt-1">
              Review submitted details for <span className="font-bold text-slate-800">{clubName}</span>.
            </p>
          </div>

          {feedbackMessage && (
            <div
              id="decisionFeedbackBanner"
              className={`p-4 rounded-2xl text-sm font-bold flex items-center justify-between border ${
                feedbackMessage.type === 'success'
                  ? 'bg-emerald-50 text-emerald-900 border-emerald-200'
                  : 'bg-rose-50 text-rose-900 border-rose-200'
              }`}
            >
              <div className="flex items-center gap-2">
                <span>{feedbackMessage.text}</span>
              </div>
              <button
                onClick={() => setFeedbackMessage(null)}
                className="text-xs font-bold underline hover:opacity-80"
              >
                Dismiss
              </button>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/80 shadow-xs space-y-5">
              <div className="flex items-center gap-3 pb-3 border-b border-slate-100">
                <div className="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                </div>
                <div>
                  <h3 className="text-base font-bold text-slate-900">Student Information</h3>
                  <p className="text-xs text-slate-400">Personal contact details</p>
                </div>
              </div>

              <div className="space-y-4 text-sm">
                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    1. Full Name
                  </span>
                  <span id="appFullName" className="font-bold text-slate-900 text-base">
                    {studentName}
                  </span>
                </div>

                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    2. Student ID
                  </span>
                  <span id="appStudentId" className="font-semibold text-slate-800 bg-slate-100 px-2.5 py-1 rounded-lg text-xs font-mono">
                    {studentId}
                  </span>
                </div>

                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    3. Email ID
                  </span>
                  <span id="appEmail" className="font-medium text-slate-800">
                    {email}
                  </span>
                </div>

                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    4. Phone Number
                  </span>
                  <span id="appPhoneNumber" className="font-medium text-slate-800">
                    {phoneNumber}
                  </span>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/80 shadow-xs space-y-5">
              <div className="flex items-center gap-3 pb-3 border-b border-slate-100">
                <div className="w-10 h-10 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                  </svg>
                </div>
                <div>
                  <h3 className="text-base font-bold text-slate-900">Academic Information</h3>
                  <p className="text-xs text-slate-400">Department and year</p>
                </div>
              </div>

              <div className="space-y-4 text-sm">
                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    5. Department
                  </span>
                  <span id="appDepartment" className="font-bold text-slate-900 text-base">
                    {department}
                  </span>
                </div>

                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    6. Year of Study
                  </span>
                  <span id="appYearOfStudy" className="inline-block font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-xl text-xs border border-indigo-100">
                    {yearOfStudy}
                  </span>
                </div>

                <div className="pt-2">
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Applied Club
                  </span>
                  <span className="font-bold text-slate-800">
                    {clubName}
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/80 shadow-xs space-y-3">
            <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">
              7. Why do you want to join this club?
            </h3>
            <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100 text-sm text-slate-800 leading-relaxed font-normal italic">
              "{reason}"
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/80 shadow-xs space-y-3">
            <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">
              8. What skills do you have to join this club?
            </h3>
            <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100 text-sm text-slate-800 leading-relaxed">
              <p className="mb-3 italic">"{skills}"</p>
              {skillList.length > 0 && (
                <div className="flex flex-wrap gap-2 pt-1 border-t border-slate-200/60">
                  {skillList.map((skill, index) => (
                    <span
                      key={index}
                      className="px-3 py-1 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-bold border border-indigo-100"
                    >
                      {skill}
                    </span>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Strict Accept / Decline Buttons ONLY */}
          <div className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <span className="text-xs text-slate-500 font-medium block">
                Decision for application:
              </span>
              <span className="text-xs font-bold text-slate-800">
                {studentName} ({studentId})
              </span>
            </div>

            <div className="flex items-center gap-3 w-full sm:w-auto">
              <button
                type="button"
                id="declineApplicationBtn"
                disabled={isProcessed}
                onClick={() => setShowDeclineModal(true)}
                className={`w-full sm:w-auto px-6 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all duration-150 ${
                  isProcessed
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                    : 'bg-white text-rose-600 hover:bg-rose-50 border border-rose-200 active:scale-98 shadow-xs'
                }`}
              >
                Decline
              </button>

              <button
                type="button"
                id="acceptApplicationBtn"
                disabled={isProcessed}
                onClick={handleAccept}
                className={`w-full sm:w-auto px-6 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all duration-150 shadow-sm ${
                  isProcessed
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                    : 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-98'
                }`}
              >
                Accept
              </button>
            </div>
          </div>

          {showDeclineModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs animate-fadeIn">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full border border-slate-200 shadow-2xl space-y-5">
                <div className="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center font-bold mx-auto">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>

                <div className="text-center">
                  <h3 className="text-lg font-extrabold text-slate-900">
                    Decline Application?
                  </h3>
                  <p className="text-xs sm:text-sm text-slate-500 mt-2 leading-relaxed">
                    Are you sure you want to decline this student's application?
                  </p>
                </div>

                <div className="flex items-center gap-3 pt-2">
                  <button
                    type="button"
                    id="cancelDeclineModalBtn"
                    onClick={() => setShowDeclineModal(false)}
                    className="w-1/2 py-2.5 px-4 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    id="confirmDeclineModalBtn"
                    onClick={handleConfirmDecline}
                    className="w-1/2 py-2.5 px-4 rounded-xl bg-rose-600 text-white text-xs font-bold hover:bg-rose-700 shadow-sm transition"
                  >
                    Decline Application
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Component: NotificationCard ---
    const NotificationCard = ({ notification, onClick }) => {
      const { studentName, clubName = 'Coding Club', createdAt, read, status = 'PENDING' } = notification;
      return (
        <div
          onClick={() => onClick(notification)}
          className={`group relative rounded-2xl p-5 transition-all duration-200 cursor-pointer border ${
            !read
              ? 'bg-indigo-50/50 border-l-4 border-l-indigo-600 border-indigo-200/80 shadow-xs hover:bg-indigo-50/80 hover:shadow-sm'
              : 'bg-white border-slate-200/80 hover:border-slate-300 hover:shadow-xs'
          }`}
        >
          <div className="flex items-start justify-between gap-4">
            <div className="flex items-start gap-4 flex-1 min-w-0">
              <div
                className={`w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0 font-bold text-sm transition-all ${
                  !read
                    ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-200'
                    : 'bg-slate-100 text-slate-600 group-hover:bg-indigo-100 group-hover:text-indigo-600'
                }`}
              >
                {studentName ? studentName.charAt(0) : 'S'}
              </div>

              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  <span className={`text-base font-bold truncate ${!read ? 'text-slate-900' : 'text-slate-700'}`}>
                    {studentName}
                  </span>
                  <span className="text-xs px-2.5 py-0.5 rounded-full font-semibold bg-slate-100 text-slate-600">
                    {clubName}
                  </span>
                  {status && (
                    <span

                Dismiss
              </button>
            </div>
          )}

          {/* Header with Title & Edit Profile Button */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                My Profile
              </h1>
              <p className="text-sm text-slate-500 mt-1">
                Teacher information
              </p>
            </div>

            {!isEditing && (
              <button
                type="button"
                id="editProfileBtn"
                onClick={handleEditClick}
                className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 text-xs sm:text-sm font-bold border border-indigo-100 transition-all shadow-xs w-fit"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                <span>Edit Profile</span>
              </button>
            )}
          </div>

          {!isEditing ? (
            /* NORMAL MINIMAL PROFILE VIEW */
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xs space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm">
                {/* 1. Name */}
                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Name
                  </span>
                  <span id="profileName" className="font-bold text-slate-900 text-base">
                    {teacher.name}
                  </span>
                </div>

                {/* 2. Staff ID */}
                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Staff ID
                  </span>
                  <span id="profileStaffId" className="font-bold text-slate-900 text-base font-mono">
                    {teacher.staffId}
                  </span>
                </div>

                {/* 3. Phone Number */}
                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Phone Number
                  </span>
                  <span id="profilePhoneNumber" className="font-bold text-slate-900 text-base">
                    {teacher.phoneNumber}
                  </span>
                </div>

                {/* 4. Department */}
                <div>
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Department
                  </span>
                  <span id="profileDepartment" className="font-bold text-slate-900 text-base">
                    {teacher.department}
                  </span>
                </div>

                {/* 5. Mentored Club */}
                <div className="sm:col-span-2 pt-4 border-t border-slate-100">
                  <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Mentored Club
                  </span>
                  <span id="profileClubMentor" className="font-extrabold text-indigo-700 text-base">
                    {teacher.club}
                  </span>
                </div>
              </div>
            </div>
          ) : (
            /* EDIT PROFILE FORM VIEW */
            <form onSubmit={handleSave} className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xs space-y-6">
              <h2 className="text-lg font-bold text-slate-900 pb-3 border-b border-slate-100">
                Edit Profile
              </h2>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm">
                {/* Name - Editable */}
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
                    Name
                  </label>
                  <input
                    type="text"
                    id="editNameInput"
                    value={formData.name}
                    onChange={e => setFormData({ ...formData, name: e.target.value })}
                    required
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-bold text-slate-900 outline-none transition"
                  />
                </div>

                {/* Staff ID - Read Only */}
                <div>
                  <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Staff ID <span className="text-[10px] font-normal text-slate-400">(Read only)</span>
                  </label>
                  <input
                    type="text"
                    value={teacher.staffId}
                    readOnly
                    disabled
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 font-mono font-bold cursor-not-allowed"
                  />
                </div>

                {/* Phone Number - Editable */}
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
                    Phone Number
                  </label>
                  <input
                    type="text"
                    id="editPhoneInput"
                    value={formData.phoneNumber}
                    onChange={e => setFormData({ ...formData, phoneNumber: e.target.value })}
                    required
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-bold text-slate-900 outline-none transition"
                  />
                </div>

                {/* Department - Editable */}
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
                    Department
                  </label>
                  <input
                    type="text"
                    id="editDepartmentInput"
                    value={formData.department}
                    onChange={e => setFormData({ ...formData, department: e.target.value })}
                    required
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-bold text-slate-900 outline-none transition"
                  />
                </div>

                {/* Mentored Club - Read Only */}
                <div className="sm:col-span-2 pt-2 border-t border-slate-100">
                  <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                    Mentored Club <span className="text-[10px] font-normal text-slate-400">(Read only)</span>
                  </label>
                  <input
                    type="text"
                    value={teacher.club}
                    readOnly
                    disabled
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 font-bold cursor-not-allowed"
                  />
                </div>
              </div>

              <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <button
                  type="button"
                  id="cancelEditBtn"
                  onClick={handleCancel}
                  className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs sm:text-sm hover:bg-slate-50 transition"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  id="saveProfileBtn"
                  className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-sm transition active:scale-98"
                >
                  Save Changes
                </button>
              </div>
            </form>
          )}
        </div>
      );
    };

    // --- Master Layout: TeacherLayout ---
    const TeacherLayout = () => {
      const {
        teacher,
        unreadCount,
        activeTab,
        setActiveTab,
        selectedApplication,
        setSelectedApplication
      } = useTeacher();

      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const handleNavClick = (tab) => {
        setActiveTab(tab);
        setSelectedApplication(null);
        setIsMobileMenuOpen(false);
      };

      const handleLogout = () => {
        if (window.confirm('Are you sure you want to log out of AgentVerse Faculty Portal?')) {
          localStorage.clear();
          sessionStorage.clear();
          window.location.href = '/';
        }
      };

      const getHeaderTitle = () => {
        if (activeTab === 'dashboard') return 'Teacher Dashboard';
        if (activeTab === 'notifications') {
          return selectedApplication ? 'Application Review' : 'Notifications';
        }
        if (activeTab === 'profile') return 'My Profile';
        return 'Dashboard';
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
          {isMobileMenuOpen && (
            <div
              className="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs lg:hidden"
              onClick={() => setIsMobileMenuOpen(false)}
            />
          )}

          <div className="flex flex-1">
            {/* LEFT SIDEBAR - Dashboard, Notifications, Profile + Logout at bottom */}
            <aside
              className={`fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200/80 flex flex-col transition-transform duration-200 ease-in-out lg:translate-x-0 lg:static lg:z-auto ${
                isMobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'
              }`}
            >
              <div className="h-18 px-6 flex items-center justify-between border-b border-slate-100">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-700 to-purple-600 flex items-center justify-center text-white font-extrabold text-lg shadow-sm shadow-indigo-100">
                    A
                  </div>
                  <div>
                    <span className="text-xl font-extrabold tracking-tight text-slate-900">
                      AgentVerse
                    </span>
                    <span className="block text-[10px] uppercase font-bold tracking-wider text-slate-400">
                      Faculty Portal
                    </span>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setIsMobileMenuOpen(false)}
                  className="lg:hidden p-1.5 text-slate-400 hover:text-slate-600 rounded-lg"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>

              <nav className="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <button
                  type="button"
                  id="navSidebarDashboard"
                  onClick={() => handleNavClick('dashboard')}
                  className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                    activeTab === 'dashboard'
                      ? 'bg-indigo-50 text-indigo-600 border border-indigo-100/80 font-bold shadow-xs'
                      : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                  }`}
                >
                  <svg className={`w-5 h-5 ${activeTab === 'dashboard' ? 'text-indigo-600' : 'text-slate-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                  </svg>
                  <span>Dashboard</span>
                </button>

                <button
                  type="button"
                  id="navSidebarNotifications"
                  onClick={() => handleNavClick('notifications')}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                    activeTab === 'notifications'
                      ? 'bg-indigo-50 text-indigo-600 border border-indigo-100/80 font-bold shadow-xs'
                      : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                  }`}
                >
                  <div className="flex items-center gap-3.5">
                    <svg className={`w-5 h-5 ${activeTab === 'notifications' ? 'text-indigo-600' : 'text-slate-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span>Notifications</span>
                  </div>
                  {unreadCount > 0 && (
                    <span id="sidebarNotificationBadge" className="px-2 py-0.5 text-xs font-bold rounded-full bg-indigo-600 text-white shadow-xs">
                      {unreadCount}
                    </span>
                  )}
                </button>

                <button
                  type="button"
                  id="navSidebarProfile"
                  onClick={() => handleNavClick('profile')}
                  className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                    activeTab === 'profile'
                      ? 'bg-indigo-50 text-indigo-600 border border-indigo-100/80 font-bold shadow-xs'
                      : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                  }`}
                >
                  <svg className={`w-5 h-5 ${activeTab === 'profile' ? 'text-indigo-600' : 'text-slate-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  <span>Profile</span>
                </button>
              </nav>

              {/* Visually Separated Logout Action at Bottom of Sidebar */}
              <div className="p-4 border-t border-slate-100 mt-auto">
                <button
                  type="button"
                  id="navSidebarLogout"
                  onClick={handleLogout}
                  className="w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold text-rose-600 hover:bg-rose-50 hover:text-rose-700 transition-all border border-transparent hover:border-rose-100"
                >
                  <svg className="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  <span>Logout</span>
                </button>
              </div>
            </aside>

            {/* MAIN AREA - Minimal Header (No search bar, no avatar logo, no notification icon) */}
            <div className="flex-1 flex flex-col min-w-0">
              <header className="h-18 bg-white border-b border-slate-200/80 px-6 sm:px-8 flex items-center justify-between sticky top-0 z-30 shadow-xs">
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setIsMobileMenuOpen(true)}
                    className="lg:hidden p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl"
                  >
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                  </button>

                  <div className="flex items-center gap-2 text-sm">
                    <span className="font-semibold text-slate-400 hidden sm:inline">AgentVerse</span>
                    <span className="text-slate-300 hidden sm:inline">/</span>
                    <h2 className="text-lg sm:text-xl font-bold text-slate-800 tracking-tight">
                      {getHeaderTitle()}
                    </h2>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold px-3.5 py-1.5 bg-slate-100 text-slate-700 rounded-full border border-slate-200/60 hidden sm:inline-block">
                    Mentor: Coding Club
                  </span>
                </div>
              </header>

              <main className="flex-1 p-6 sm:p-8 lg:p-10">
                {activeTab === 'dashboard' && <TeacherDashboard />}
                {activeTab === 'notifications' && <TeacherNotifications />}
                {activeTab === 'profile' && <TeacherProfile />}
              </main>
            </div>
          </div>
        </div>
      );
    };

    // Mount App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <TeacherProvider>
        <TeacherLayout />
      </TeacherProvider>
    );
  </script>
</body>
</html>
